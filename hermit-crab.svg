<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <style>
    .otter-g  { animation: otter-in 5s ease-in-out infinite; }
    .otter-fade { animation: otter-hide 5s ease-in-out infinite; }
    .paws-walk { animation: paws 5s ease-in-out infinite; }
    .float-g  { animation: float-bob 5s ease-in-out infinite; }
    .peek-face { animation: face-up 5s ease-out infinite; }
    .peek-paws { animation: paws-up 5s ease-out infinite; }
    .stone    { animation: stone-show 5s ease-out infinite; }
    .heart    { animation: heart-pop 5s ease-out infinite; }
    .sp       { animation: sp-pop 5s ease-out infinite; }
    .wave1    { animation: wave 3s ease-in-out infinite; }
    .wave2    { animation: wave 3s ease-in-out infinite; animation-delay: -1s; }
    .wave3    { animation: wave 3s ease-in-out infinite; animation-delay: -2s; }
    .blink-l  { animation: blink 5s ease-in-out infinite; }
    .blink-r  { animation: blink 5s ease-in-out infinite; animation-delay: 0.05s; }

    @keyframes otter-in {
      0%,8%   { transform: translateX(70px); }
      30%     { transform: translateX(10px); }
      /* pause to find stone */
      35%     { transform: translateX(10px) translateY(0); }
      38%     { transform: translateX(10px) translateY(-6px); }
      41%     { transform: translateX(10px) translateY(0); }
      50%     { transform: translateX(0); }
      100%    { transform: translateX(0); }
    }
    @keyframes otter-hide {
      0%,48%  { opacity:1; }
      56%     { opacity:0; }
      100%    { opacity:0; }
    }
    @keyframes paws {
      0%      { transform: rotate(0); }
      5%      { transform: rotate(8deg); }
      10%     { transform: rotate(-8deg); }
      15%     { transform: rotate(6deg); }
      20%     { transform: rotate(-6deg); }
      25%     { transform: rotate(3deg); }
      30%,100% { transform: rotate(0); }
    }
    @keyframes float-bob {
      0%,54%  { transform: translateY(0); }
      60%     { transform: translateY(0); }
      70%     { transform: translateY(-2px); }
      80%     { transform: translateY(1px); }
      90%     { transform: translateY(-1px); }
      100%    { transform: translateY(0); }
    }
    @keyframes face-up {
      0%,54%  { opacity:0; transform: translateY(8px); }
      64%     { opacity:1; transform: translateY(0); }
      100%    { opacity:1; }
    }
    @keyframes paws-up {
      0%,58%  { opacity:0; transform: translateY(6px); }
      68%     { opacity:1; transform: translateY(0); }
      100%    { opacity:1; }
    }
    @keyframes stone-show {
      0%,60%  { opacity:0; transform: scale(0); }
      70%     { opacity:1; transform: scale(1.15); }
      76%     { transform: scale(1); }
      100%    { opacity:1; transform: scale(1); }
    }
    @keyframes blink {
      0%,78%  { transform: scaleY(1); }
      80%     { transform: scaleY(0.05); }
      82%     { transform: scaleY(1); }
      100%    { transform: scaleY(1); }
    }
    @keyframes heart-pop {
      0%,72%  { opacity:0; transform: scale(0) translate(0,0); }
      78%     { opacity:1; transform: scale(1.1) translate(0,-2px); }
      86%     { opacity:1; transform: scale(1) translate(0,-8px); }
      96%     { opacity:0; transform: scale(0.5) translate(0,-18px); }
      100%    { opacity:0; }
    }
    @keyframes sp-pop {
      0%,74%  { opacity:0; transform: scale(0); }
      80%     { opacity:1; transform: scale(1.2); }
      88%     { opacity:0.4; transform: scale(1); }
      100%    { opacity:0; transform: scale(0); }
    }
    @keyframes wave {
      0%   { transform: translateY(0) scaleY(1); opacity:0.3; }
      50%  { transform: translateY(-2px) scaleY(0.8); opacity:0.15; }
      100% { transform: translateY(0) scaleY(1); opacity:0.3; }
    }
  </style>

  <!-- Water surface (gentle waves) -->
  <path class="wave1" d="M 0 105 Q 25 100 50 105 Q 75 110 100 105 Q 125 100 150 105 Q 175 110 200 105 L 200 140 L 0 140 Z" fill="#d0e8f0" opacity="0.3" transform-origin="100 120"/>
  <path class="wave2" d="M 0 110 Q 30 106 60 110 Q 90 114 120 110 Q 150 106 180 110 Q 195 112 200 110 L 200 140 L 0 140 Z" fill="#c4dfe8" opacity="0.25" transform-origin="100 120"/>
  <path class="wave3" d="M 0 114 Q 35 110 70 114 Q 100 118 130 114 Q 160 110 200 114 L 200 140 L 0 140 Z" fill="#b8d4e0" opacity="0.2" transform-origin="100 120"/>

  <!-- ===== FLOATING OTTER (after entering water) ===== -->
  <g class="float-g" transform-origin="80 108">
    <!-- Body floating on water (belly up, oval) -->
    <ellipse cx="80" cy="110" rx="30" ry="12" fill="#b08860" opacity="0" class="peek-face"/>

    <!-- Belly (lighter) -->
    <ellipse cx="80" cy="109" rx="24" ry="9" fill="#e8d0b0" opacity="0" class="peek-face"/>

    <!-- Face -->
    <g class="peek-face">
      <!-- Head -->
      <ellipse cx="52" cy="106" rx="14" ry="12" fill="#b08860"/>
      <!-- Face patch -->
      <ellipse cx="52" cy="108" rx="10" ry="8" fill="#ddc8a8"/>
      <!-- Ears -->
      <circle cx="40" cy="100" r="3" fill="#b08860" stroke="#9a7550" stroke-width="0.8"/>
      <circle cx="40" cy="100" r="1.5" fill="#c4a070"/>
      <circle cx="64" cy="100" r="3" fill="#b08860" stroke="#9a7550" stroke-width="0.8"/>
      <circle cx="64" cy="100" r="1.5" fill="#c4a070"/>
      <!-- Eyes -->
      <g class="blink-l" transform-origin="47 105">
        <ellipse cx="47" cy="105" rx="2.5" ry="2.8" fill="#1a1210"/>
        <circle cx="46.3" cy="104" r="0.8" fill="white"/>
      </g>
      <g class="blink-r" transform-origin="57 105">
        <ellipse cx="57" cy="105" rx="2.5" ry="2.8" fill="#1a1210"/>
        <circle cx="56.3" cy="104" r="0.8" fill="white"/>
      </g>
      <!-- Nose -->
      <ellipse cx="52" cy="109" rx="2.5" ry="1.8" fill="#3a2820"/>
      <!-- Mouth -->
      <path d="M 49 111 Q 52 114 55 111" fill="none" stroke="#6a4a30" stroke-width="0.8" stroke-linecap="round"/>
      <!-- Whisker dots -->
      <circle cx="44" cy="109" r="0.6" fill="#8a7050"/>
      <circle cx="43" cy="111" r="0.6" fill="#8a7050"/>
      <circle cx="60" cy="109" r="0.6" fill="#8a7050"/>
      <circle cx="61" cy="111" r="0.6" fill="#8a7050"/>
      <!-- Cheek blush -->
      <ellipse cx="44" cy="108" rx="3" ry="1.5" fill="#d4a080" opacity="0.3"/>
      <ellipse cx="60" cy="108" rx="3" ry="1.5" fill="#d4a080" opacity="0.3"/>
    </g>

    <!-- Paws holding stone on belly -->
    <g class="peek-paws">
      <!-- Left paw -->
      <ellipse cx="72" cy="104" rx="5" ry="4" fill="#b08860" stroke="#9a7550" stroke-width="0.8"/>
      <!-- Right paw -->
      <ellipse cx="88" cy="104" rx="5" ry="4" fill="#b08860" stroke="#9a7550" stroke-width="0.8"/>
      <!-- Paw pads -->
      <circle cx="70" cy="103" r="1" fill="#c4a070" opacity="0.5"/>
      <circle cx="73" cy="103" r="1" fill="#c4a070" opacity="0.5"/>
      <circle cx="86" cy="103" r="1" fill="#c4a070" opacity="0.5"/>
      <circle cx="89" cy="103" r="1" fill="#c4a070" opacity="0.5"/>
    </g>

    <!-- Stone on belly -->
    <g class="stone" transform-origin="80 102">
      <ellipse cx="80" cy="102" rx="7" ry="5" fill="#a8b0b8" stroke="#8a9098" stroke-width="1"/>
      <ellipse cx="78" cy="101" rx="3" ry="2" fill="#b8c0c8" opacity="0.5"/>
    </g>

    <!-- Feet sticking up -->
    <g class="peek-paws">
      <ellipse cx="100" cy="108" rx="5" ry="6" fill="#b08860" stroke="#9a7550" stroke-width="0.8"/>
      <ellipse cx="110" cy="110" rx="5" ry="6" fill="#b08860" stroke="#9a7550" stroke-width="0.8"/>
    </g>

    <!-- Heart -->
    <path class="heart" transform-origin="76 86"
          d="M 76 90 C 76 86 72 84 70 86 C 68 88 68 90 70 93 L 76 98 L 82 93 C 84 90 84 88 82 86 C 80 84 76 86 76 90 Z"
          fill="#e8a0b0" opacity="0"/>
  </g>

  <!-- ===== WALKING OTTER ===== -->
  <g class="otter-g">
    <g class="otter-fade">
      <!-- Shadow -->
      <ellipse cx="148" cy="118" rx="16" ry="3" fill="#c4b8a0" opacity="0.2"/>

      <!-- Tail -->
      <path d="M 164 100 Q 174 96 178 90 Q 180 86 176 84" fill="none" stroke="#b08860" stroke-width="4" stroke-linecap="round"/>

      <!-- Body -->
      <ellipse cx="148" cy="104" rx="20" ry="11" fill="#b08860"/>
      <!-- Belly -->
      <ellipse cx="146" cy="106" rx="14" ry="7" fill="#ddc8a8"/>

      <!-- Head -->
      <circle cx="126" cy="98" r="12" fill="#b08860"/>
      <!-- Face patch -->
      <ellipse cx="126" cy="100" rx="9" ry="7" fill="#ddc8a8"/>
      <!-- Ears -->
      <circle cx="116" cy="92" r="2.5" fill="#b08860" stroke="#9a7550" stroke-width="0.6"/>
      <circle cx="136" cy="92" r="2.5" fill="#b08860" stroke="#9a7550" stroke-width="0.6"/>
      <!-- Eyes (looking forward, excited) -->
      <ellipse cx="122" cy="97" rx="2.2" ry="2.5" fill="#1a1210"/>
      <circle cx="121.5" cy="96.2" r="0.7" fill="white"/>
      <ellipse cx="130" cy="97" rx="2.2" ry="2.5" fill="#1a1210"/>
      <circle cx="129.5" cy="96.2" r="0.7" fill="white"/>
      <!-- Nose -->
      <ellipse cx="126" cy="101" rx="2.2" ry="1.5" fill="#3a2820"/>
      <!-- Mouth (smile) -->
      <path d="M 123 103 Q 126 106 129 103" fill="none" stroke="#6a4a30" stroke-width="0.8" stroke-linecap="round"/>
      <!-- Whisker dots -->
      <circle cx="119" cy="101" r="0.5" fill="#8a7050"/>
      <circle cx="118" cy="103" r="0.5" fill="#8a7050"/>
      <circle cx="133" cy="101" r="0.5" fill="#8a7050"/>
      <circle cx="134" cy="103" r="0.5" fill="#8a7050"/>
      <!-- Cheek -->
      <ellipse cx="119" cy="100" rx="2.5" ry="1.5" fill="#d4a080" opacity="0.3"/>
      <ellipse cx="133" cy="100" rx="2.5" ry="1.5" fill="#d4a080" opacity="0.3"/>

      <!-- Legs -->
      <g class="paws-walk" transform-origin="140 112">
        <rect x="136" y="110" width="5" height="8" rx="2.5" fill="#9a7550"/>
        <rect x="144" y="110" width="5" height="8" rx="2.5" fill="#a08060"/>
        <rect x="152" y="110" width="5" height="8" rx="2.5" fill="#9a7550"/>
        <rect x="158" y="110" width="5" height="8" rx="2.5" fill="#a08060"/>
      </g>
    </g>
  </g>

  <!-- Stone on ground (what the otter finds) -->
  <g class="otter-fade" style="animation-name: stone-ground;">
    <style>
      @keyframes stone-ground {
        0%,30% { opacity:1; }
        50%    { opacity:0; }
        100%   { opacity:0; }
      }
    </style>
    <ellipse cx="88" cy="116" rx="6" ry="4" fill="#a8b0b8" stroke="#8a9098" stroke-width="1"/>
    <ellipse cx="86" cy="115" rx="2.5" ry="1.5" fill="#b8c0c8" opacity="0.5"/>
  </g>

  <!-- Sparkles -->
  <circle class="sp" cx="40" cy="82" r="2" fill="#c9a0dc" transform-origin="40 82"/>
  <circle class="sp" cx="106" cy="86" r="1.8" fill="#dbc4e8" transform-origin="106 86" style="animation-delay:.12s"/>
  <circle class="sp" cx="30" cy="100" r="1.5" fill="#90c8d8" transform-origin="30 100" style="animation-delay:.2s"/>
</svg>
