<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Brief</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./gmarket-advanced.tailwind.js"></script>
    <link rel="stylesheet" href="./gmarket-advanced.css">
    <link rel="stylesheet" href="./gmarket-advanced-clean-home-v2.css?v=2">
</head>
<body class="clean-home-page">

    <section class="clean-home">
        <div class="clean-home__wrap">
            <div class="beauty-search-stage">
                <div class="beauty-greeting">
                    <span>유진님,<br>오늘은 어떤 루틴이 궁금해요?</span>
                </div>

                <form id="searchForm" class="clean-search group" onsubmit="return goSurvey()">
                    <div class="clean-search__box">
                        <textarea id="searchInput" rows="1" placeholder="무너지지 않는 출근 메이크업 찾아줘" class="resize-none overflow-hidden"></textarea>
                        <button type="submit" id="submitBtn" aria-label="검색" disabled>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </button>
                    </div>
                </form>

                <div class="clean-tag-row" aria-label="뷰티 키워드 시나리오">
                    <button type="button" class="suggestion-tag" data-query="출근 전 10분 안에 완성하는 지속력 데일리 메이크업">#출근_10분룩</button>
                    <button type="button" class="suggestion-tag" data-query="내 얼굴 사진으로 코랄 메이크업 AI 시뮬레이션">#AI_페이스룩</button>
                    <button type="button" class="suggestion-tag" data-query="민감 피부를 위한 성분 궁합 체크">#성분_궁합체크</button>
                    <button type="button" class="suggestion-tag" data-query="주말 여행 파우치 뷰티 구성">#여행파우치</button>
                    <button type="button" class="suggestion-tag" data-query="30대 남자 스킨케어 화장품 성분 비교">#남자_성분비교</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        const input = document.getElementById('searchInput');
        const btn = document.getElementById('submitBtn');

        input.addEventListener('input', function() {
            btn.disabled = !this.value.trim();
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        function goSurvey() {
            const q = input.value.trim();
            if (q) window.location.href = './gmarket-advanced-survey-v2.html?q=' + encodeURIComponent(q);
            return false;
        }

        document.querySelectorAll('.suggestion-tag').forEach(function(tag) {
            tag.addEventListener('click', function() {
                window.location.href = './gmarket-advanced-survey-v2.html?q=' + encodeURIComponent(this.dataset.query);
            });
        });
    </script>

</body>
</html>
